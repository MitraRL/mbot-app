<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Турнирная сетка</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-slate-900 text-white p-4 font-sans antialiased min-h-screen">
  <div class="max-w-md mx-auto">
    
    <h1 class="text-2xl font-bold text-center mt-2 mb-6 text-slate-100">Сетка турнира</h1>
    
    <!-- Скрытая панель администратора -->
    <div id="admin-panel" class="hidden bg-slate-800/80 border border-blue-500/40 rounded-2xl p-4 mb-6 shadow-lg">
      <h2 class="text-sm font-bold text-blue-400 mb-3">👑 Панель организатора</h2>
      <div class="space-y-3">
        <div class="grid grid-cols-2 gap-2">
          <input id="new-p1" type="text" placeholder="Игрок 1" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
          <input id="new-p2" type="text" placeholder="Игрок 2" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
        </div>
        <select id="new-round" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
          <option value="1/8 финала">1/8 финала</option>
          <option value="1/4 финала">1/4 финала</option>
          <option value="Полуфинал">Полуфинал</option>
          <option value="Финал">Финал</option>
        </select>
        <button onclick="createMatch()" class="w-full bg-blue-600 hover:bg-blue-500 py-2 rounded-xl text-xs font-semibold">+ Создать матч</button>
      </div>
    </div>

    <!-- Настройки профиля -->
    <div class="bg-slate-800 rounded-2xl p-4 mb-6 border border-slate-700/50 shadow-sm">
      <p class="text-sm text-slate-400 mb-2">Твое имя в таблице:</p>
      <div class="flex space-x-2">
        <input id="nickname-input" type="text" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm">
        <button onclick="saveNickname()" id="save-btn" class="bg-blue-600 px-4 py-2 rounded-xl text-sm font-semibold">Сохранить</button>
      </div>
    </div>
    
    <!-- Вкладки раундов -->
    <div class="flex overflow-x-auto space-x-2 pb-2 mb-6" id="round-buttons">
      <button onclick="setRound('1/8 финала')" id="btn-1-8" class="px-5 py-2.5 rounded-full text-sm font-semibold bg-blue-500 text-white transition">1/8 финала</button>
      <button onclick="setRound('1/4 финала')" id="btn-1-4" class="px-5 py-2.5 rounded-full text-sm font-semibold bg-slate-800 text-slate-400 transition">1/4 финала</button>
      <button onclick="setRound('Полуфинал')" id="btn-semi" class="px-5 py-2.5 rounded-full text-sm font-semibold bg-slate-800 text-slate-400 transition">Полуфинал</button>
      <button onclick="setRound('Финал')" id="btn-final" class="px-5 py-2.5 rounded-full text-sm font-semibold bg-slate-800 text-slate-400 transition">Финал</button>
    </div>

    <!-- Матчи -->
    <div id="db-matches" class="space-y-4 mb-8"></div>
    
    <!-- Участники и статистика -->
    <h2 class="text-lg font-bold mb-4 text-slate-200">🏆 Участники и статистика:</h2>
    <div id="db-players" class="space-y-3 text-slate-300"></div>
    
  </div>

  <script>
    // --- ИНИЦИАЛИЗАЦИЯ TELEGRAM ---
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
    
    const tgUser = window.Telegram.WebApp.initDataUnsafe?.user;
    const tgUsername = (tgUser && tgUser.username) ? tgUser.username : 'Гость';
    const telegramId = (tgUser && tgUser.id) ? tgUser.id : Math.floor(Math.random() * 1000000);
    
    const ADMIN_ID = 438290253;
    
    // --- НАСТРОЙКИ SUPABASE ---
    const SUPABASE_URL = 'https://kvsrxuibrovumaikqptk.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt2c3J4dWlicm92dW1haWtxcHRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4Nzc0NTYsImV4cCI6MjEwMDQ1MzQ1Nn0.uKkIbZi7I0Q0jL0oMMq5k4ABQ_ge18yJo7tYSB_PYRI';
    
    const baseHeaders = { 
      'apikey': SUPABASE_KEY, 
      'Authorization': `Bearer ${SUPABASE_KEY}`, 
      'Content-Type': 'application/json' 
    };

    // Глобальные переменные
    let allMatches = [];
    let allUsers = [];
    let currentRound = '1/8 финала';

    // Показываем админ-панель, если это создатель
    if (telegramId === ADMIN_ID) {
      document.getElementById('admin-panel').classList.remove('hidden');
    }

    // --- ФУНКЦИЯ ПЕРЕКЛЮЧЕНИЯ РАУНДОВ ---
    window.setRound = function(roundName) {
      currentRound = roundName;
      const buttons = document.querySelectorAll('#round-buttons button');
      
      // Сбрасываем стили всех кнопок
      buttons.forEach(btn => {
        btn.className = 'px-5 py-2.5 rounded-full text-sm font-semibold bg-slate-800 text-slate-400 transition';
      });
      
      // Делаем активную кнопку синей
      let actId = '';
      if (roundName === '1/8 финала') actId = 'btn-1-8';
      else if (roundName === '1/4 финала') actId = 'btn-1-4';
      else if (roundName === 'Полуфинал') actId = 'btn-semi';
      else if (roundName === 'Финал') actId = 'btn-final';
      
      document.getElementById(actId).className = 'px-5 py-2.5 rounded-full text-sm font-semibold bg-blue-500 text-white transition';
      
      renderMatches();
    }

    // --- ФУНКЦИЯ ОТПРАВКИ УВЕДОМЛЕНИЙ В ОЧЕРЕДЬ ---
    async function sendNotification(username, text) {
      let user = allUsers.find(u => u.username === username);
      
      if (user && user.id) {
        try {
          await fetch(`${SUPABASE_URL}/rest/v1/notifications`, {
            method: 'POST',
            headers: baseHeaders,
            body: JSON.stringify({ 
              telegram_id: user.id, 
              message: text 
            })
          });
        } catch(e) { 
          console.error('Ошибка добавления уведомления в очередь', e); 
        }
      }
    }

    // --- ФУНКЦИЯ ОТРИСОВКИ МАТЧЕЙ ---
    function renderMatches() {
      const container = document.getElementById('db-matches');
      const filteredMatches = allMatches.filter(m => m.round === currentRound);
      const isAdmin = (telegramId === ADMIN_ID);

      if (filteredMatches.length > 0) {
        container.innerHTML = filteredMatches.map(m => `
          <div class="bg-slate-800 rounded-2xl p-5 border border-slate-700/50 shadow-sm ${m.is_completed ? 'opacity-80' : ''}">
            <div class="text-center text-xs text-slate-400 mb-2">${m.round}</div>
            <div class="flex justify-between items-center font-bold text-slate-200">
              <span class="w-2/5 text-right truncate pr-2">${m.player1}</span> 
              <span class="w-1/5 text-center text-blue-400 text-lg">${m.score1} : ${m.score2}</span> 
              <span class="w-2/5 text-left truncate pl-2">${m.player2}</span>
            </div>
            
            ${isAdmin ? (m.is_completed ? `
              <div class="mt-4 pt-3 border-t border-slate-700/50 text-center text-xs text-green-400 font-semibold">
                ✅ Матч завершен
              </div>
            ` : `
              <div class="mt-4 pt-3 border-t border-slate-700/50 flex flex-col space-y-2">
                <div class="flex justify-center space-x-2">
                  <button onclick="changeScore(${m.id}, ${m.score1 + 1}, ${m.score2}, '${m.player1}', '${m.player2}')" class="bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-xs">+1 к ${m.player1}</button>
                  <button onclick="changeScore(${m.id}, ${m.score1}, ${m.score2 + 1}, '${m.player1}', '${m.player2}')" class="bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-xs">+1 к ${m.player2}</button>
                  <button onclick="resetScore(${m.id}, '${m.player1}', '${m.player2}')" class="bg-red-900/40 hover:bg-red-900/60 text-red-300 px-2 py-1 rounded text-xs">Сброс</button>
                </div>
                <button onclick="finishMatch(${m.id}, '${m.player1}', '${m.player2}', ${m.score1}, ${m.score2})" class="bg-green-600 hover:bg-green-500 py-2 rounded-lg text-xs font-semibold text-white">🏁 Завершить матч</button>
              </div>
            `) : (m.is_completed ? `
              <div class="mt-4 pt-3 border-t border-slate-700/50 text-center text-xs text-green-400 font-semibold">
                ✅ Матч завершен
              </div>
            ` : '')}
          </div>
        `).join('');
      } else {
        container.innerHTML = `<div class="text-center text-slate-500 text-sm bg-slate-800/50 p-4 rounded-xl border border-slate-700/30">Матчей пока нет.</div>`;
      }
    }

    // --- ФУНКЦИЯ СОЗДАНИЯ МАТЧА ---
    window.createMatch = async function() {
      const p1 = document.getElementById('new-p1').value.trim();
      const p2 = document.getElementById('new-p2').value.trim();
      const round = document.getElementById('new-round').value;
      
      if (!p1 || !p2) return;
      
      // Запись в БД
      await fetch(`${SUPABASE_URL}/rest/v1/matches`, {
        method: 'POST', 
        headers: baseHeaders,
        body: JSON.stringify({ 
          player1: p1, 
          player2: p2, 
          score1: 0, 
          score2: 0, 
          round: round, 
          is_completed: false 
        })
      });
      
      // Отправка уведомлений обоим игрокам
      let msg = `🔥 Для тебя назначен новый матч!\nСтадия: ${round}\nСоперник: ${p1} vs ${p2}`;
      await sendNotification(p1, msg);
      await sendNotification(p2, msg);
      
      // Очистка полей и обновление экрана
      document.getElementById('new-p1').value = ''; 
      document.getElementById('new-p2').value = '';
      await loadTournament();
    }

    // --- ФУНКЦИЯ ИЗМЕНЕНИЯ СЧЕТА ---
    window.changeScore = async function(matchId, s1, s2, p1Name, p2Name) {
      await fetch(`${SUPABASE_URL}/rest/v1/matches?id=eq.${matchId}`, {
        method: 'PATCH', 
        headers: baseHeaders, 
        body: JSON.stringify({ score1: s1, score2: s2 })
      });
      
      let msg = `⚽ Изменение счета в твоем матче!\nТекущий счет: ${p1Name} [${s1} : ${s2}] ${p2Name}`;
      await sendNotification(p1Name, msg);
      await sendNotification(p2Name, msg);
      
      await loadTournament();
    }

    // Сброс счета
    window.resetScore = async function(matchId, p1, p2) { 
      window.changeScore(matchId, 0, 0, p1, p2); 
    }

    // --- ФУНКЦИЯ ЗАВЕРШЕНИЯ МАТЧА ---
    window.finishMatch = async function(matchId, p1Name, p2Name, s1, s2) {
      if (!confirm('Завершить матч?')) return;
      
      let p1 = allUsers.find(u => u.username === p1Name);
      let p2 = allUsers.find(u => u.username === p2Name);

      // Обновляем статистику первого игрока
      if (p1) {
        let wins = p1.wins || 0; 
        let losses = p1.losses || 0;
        
        if (s1 > s2) wins++; 
        if (s1 < s2) losses++;
        
        await fetch(`${SUPABASE_URL}/rest/v1/users?id=eq.${p1.id}`, {
          method: 'PATCH', 
          headers: baseHeaders,
          body: JSON.stringify({ 
            wins: wins, 
            losses: losses, 
            goals_for: (p1.goals_for || 0) + s1, 
            goals_against: (p1.goals_against || 0) + s2 
          })
        });
      }
      
      // Обновляем статистику второго игрока
      if (p2) {
        let wins = p2.wins || 0; 
        let losses = p2.losses || 0;
        
        if (s2 > s1) wins++; 
        if (s2 < s1) losses++;
        
        await fetch(`${SUPABASE_URL}/rest/v1/users?id=eq.${p2.id}`, {
          method: 'PATCH', 
          headers: baseHeaders,
          body: JSON.stringify({ 
            wins: wins, 
            losses: losses, 
            goals_for: (p2.goals_for || 0) + s2, 
            goals_against: (p2.goals_against || 0) + s1 
          })
        });
      }

      // Помечаем матч завершенным
      await fetch(`${SUPABASE_URL}/rest/v1/matches?id=eq.${matchId}`, {
          method: 'PATCH', 
          headers: baseHeaders, 
          body: JSON.stringify({ is_completed: true })
      });
      
      // Уведомляем игроков
      let msg = `🏁 Матч завершен!\nИтоговый счет: ${p1Name} [${s1} : ${s2}] ${p2Name}\nЗагляни в турнирную таблицу!`;
      await sendNotification(p1Name, msg);
      await sendNotification(p2Name, msg);

      await loadTournament();
    }

    // --- ФУНКЦИЯ УДАЛЕНИЯ ИГРОКА ---
    window.deletePlayer = async function(userId) {
      if (!confirm('Удалить?')) return;
      
      await fetch(`${SUPABASE_URL}/rest/v1/users?id=eq.${userId}`, { 
        method: 'DELETE', 
        headers: baseHeaders 
      });
      
      await loadTournament();
    }

    // --- ГЛАВНАЯ ФУНКЦИЯ ЗАГРУЗКИ ДАННЫХ ---
    async function loadTournament() {
      let res = await fetch(`${SUPABASE_URL}/rest/v1/users?select=*`, { headers: baseHeaders });
      allUsers = await res.json();
      
      let me = allUsers.find(u => u.id === telegramId);
      
      // Регистрируем нового игрока, если его нет
      if (!me) {
        await fetch(`${SUPABASE_URL}/rest/v1/users`, {
          method: 'POST', 
          headers: { ...baseHeaders, 'Prefer': 'resolution=merge-duplicates' },
          body: JSON.stringify({ 
            id: telegramId, 
            username: tgUsername, 
            wins: 0, 
            losses: 0, 
            goals_for: 0, 
            goals_against: 0 
          })
        });
        res = await fetch(`${SUPABASE_URL}/rest/v1/users?select=*`, { headers: baseHeaders });
        allUsers = await res.json();
      }
      
      // Сортировка по очкам и разнице мячей
      allUsers.sort((a, b) => {
        let ptsA = (a.wins || 0) * 3; 
        let ptsB = (b.wins || 0) * 3;
        
        if (ptsA !== ptsB) return ptsB - ptsA;
        return ((b.goals_for || 0) - (b.goals_against || 0)) - ((a.goals_for || 0) - (a.goals_against || 0));
      });

      // Отрисовка списка игроков
      document.getElementById('db-players').innerHTML = allUsers.map((user, i) => {
        const isMe = user.id === telegramId;
        const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '⚽';
        const bgStyle = isMe ? 'border-blue-500/50 bg-blue-900/20' : 'border-slate-700/50 bg-slate-800';
        
        return `
          <div class="p-4 rounded-xl border shadow-sm ${bgStyle}">
            <div class="flex items-center justify-between mb-2">
              <div class="flex items-center">
                <div class="w-8 h-8 rounded-full bg-blue-500/20 flex items-center justify-center mr-3 text-blue-400">${medal}</div>
                <span class="font-semibold text-slate-200">${user.username || 'Аноним'}</span>
              </div>
              ${(telegramId === ADMIN_ID) ? `<button onclick="deletePlayer(${user.id})" class="text-red-400/50 hover:text-red-400 hover:bg-red-900/30 px-2 py-1 rounded text-xs transition">✕ Удалить</button>` : ''}
            </div>
            <div class="grid grid-cols-3 gap-2 text-center text-xs bg-slate-900/50 p-2 rounded-lg text-slate-400">
              <div>Поб/Пор: <span class="text-white font-bold">${user.wins || 0} / ${user.losses || 0}</span></div>
              <div>Голы: <span class="text-white font-bold">${user.goals_for || 0} : ${user.goals_against || 0}</span></div>
              <div>Очки: <span class="text-blue-400 font-bold">${(user.wins || 0) * 3}</span></div>
            </div>
          </div>`;
      }).join('');

      // Загрузка матчей
      let matchesRes = await fetch(`${SUPABASE_URL}/rest/v1/matches?select=*`, { headers: baseHeaders });
      allMatches = await matchesRes.json();
      renderMatches();
    }

    // --- ФУНКЦИЯ СМЕНЫ ИМЕНИ ---
    window.saveNickname = async function() {
      const newName = document.getElementById('nickname-input').value.trim();
      if (!newName) return;
      
      await fetch(`${SUPABASE_URL}/rest/v1/users?id=eq.${telegramId}`, {
        method: 'PATCH', 
        headers: baseHeaders, 
        body: JSON.stringify({ username: newName })
      });
      
      await loadTournament();
    }
    
    // Запускаем загрузку при открытии
    loadTournament();
  </script>
</body>
</html>
