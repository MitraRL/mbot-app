<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Турнирный Хаб</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-slate-900 text-white font-sans antialiased min-h-screen">
  
  <div class="max-w-md mx-auto p-4 pb-24">
    
    <h1 class="text-xl font-bold text-center mt-2 mb-6 text-slate-100 uppercase tracking-wider" id="page-title">
      Сетка турнира
    </h1>

    <!-- ================= ВКЛАДКА 1: МАТЧИ ================= -->
    <div id="tab-matches" class="tab-content block">
      <div class="flex overflow-x-auto space-x-2 pb-2 mb-4 scrollbar-hide" id="round-buttons">
        <button onclick="setRound('Группы')" id="btn-groups" class="px-5 py-2.5 rounded-full text-sm font-semibold bg-blue-500 text-white transition whitespace-nowrap">Группы</button>
        <button onclick="setRound('1/16 финала')" id="btn-1-16" class="px-5 py-2.5 rounded-full text-sm font-semibold bg-slate-800 text-slate-400 transition whitespace-nowrap">1/16</button>
        <button onclick="setRound('1/8 финала')" id="btn-1-8" class="px-5 py-2.5 rounded-full text-sm font-semibold bg-slate-800 text-slate-400 transition whitespace-nowrap">1/8</button>
        <button onclick="setRound('1/4 финала')" id="btn-1-4" class="px-5 py-2.5 rounded-full text-sm font-semibold bg-slate-800 text-slate-400 transition whitespace-nowrap">1/4</button>
        <button onclick="setRound('Полуфинал')" id="btn-semi" class="px-5 py-2.5 rounded-full text-sm font-semibold bg-slate-800 text-slate-400 transition whitespace-nowrap">1/2</button>
        <button onclick="setRound('Финал')" id="btn-final" class="px-5 py-2.5 rounded-full text-sm font-semibold bg-slate-800 text-slate-400 transition whitespace-nowrap">Финал</button>
      </div>
      
      <div id="db-matches" class="space-y-4">
        <div class="text-center py-4 text-slate-500 text-sm animate-pulse">Загрузка матчей...</div>
      </div>
    </div>

    <!-- ================= ВКЛАДКА 2: РЕЙТИНГ (ГРУППЫ) ================= -->
    <div id="tab-table" class="tab-content hidden">
      <div id="db-players" class="space-y-6 text-slate-300">
        <div class="text-center py-4 animate-pulse">Загрузка рейтинга...</div>
      </div>
    </div>

    <!-- ================= ВКЛАДКА 3: НАСТРОЙКИ И АДМИНКА ================= -->
    <div id="tab-profile" class="tab-content hidden space-y-6">
      
      <!-- Профиль игрока -->
      <div class="bg-slate-800 rounded-2xl p-5 border border-slate-700/50 shadow-sm">
        <h2 class="text-sm font-bold text-slate-200 mb-4">Твой профиль</h2>
        <div class="flex space-x-2">
          <input id="nickname-input" type="text" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm" placeholder="Никнейм">
          <button onclick="saveNickname()" id="save-btn" class="bg-blue-600 px-4 py-2 rounded-xl text-sm font-semibold hover:bg-blue-500 transition">Сохранить</button>
        </div>
      </div>

      <!-- Панель администратора -->
      <div id="admin-panel" class="hidden bg-slate-800/80 border border-blue-500/40 rounded-2xl p-5 shadow-lg relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-600 to-purple-600"></div>
        <h2 class="text-sm font-bold text-blue-400 mb-4 flex items-center">👑 Панель организатора</h2>
        
        <!-- Блок умной автоматики -->
        <div class="bg-slate-900/50 p-3 rounded-xl border border-blue-500/20 mb-4 space-y-2">
          <p class="text-[10px] text-slate-400 uppercase font-bold tracking-wider mb-2">Автоматизация турнира</p>
          <button onclick="autoDrawGroups()" class="w-full bg-indigo-600 hover:bg-indigo-500 py-2 rounded-lg text-xs font-bold text-white transition flex justify-center items-center">
            <span class="mr-2">🎲</span> Сформировать группы
          </button>
          <button onclick="startPlayoffs()" class="w-full bg-purple-600 hover:bg-purple-500 py-2 rounded-lg text-xs font-bold text-white transition flex justify-center items-center">
            <span class="mr-2">🚀</span> Запустить Плей-офф
          </button>
        </div>
        
        <!-- Ручное создание матчей -->
        <div class="space-y-3 pt-3 border-t border-slate-700/50">
          <p class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Ручное создание матча</p>
          <div class="grid grid-cols-2 gap-2">
            <input id="new-p1" type="text" placeholder="Игрок 1" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
            <input id="new-p2" type="text" placeholder="Игрок 2" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
          </div>
          <select id="new-round" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
            <option value="Группы">Групповой этап</option>
            <option value="1/16 финала">1/16 финала</option>
            <option value="1/8 финала">1/8 финала</option>
            <option value="1/4 финала">1/4 финала</option>
            <option value="Полуфинал">Полуфинал</option>
            <option value="Финал">Финал</option>
          </select>
          <button onclick="createMatch()" class="w-full bg-blue-600 hover:bg-blue-500 py-2.5 rounded-xl text-xs font-bold text-white transition">
            Создать матч вручную
          </button>
        </div>
      </div>
    </div>

  </div>

  <!-- НИЖНЕЕ НАВИГАЦИОННОЕ МЕНЮ -->
  <div class="fixed bottom-0 left-0 w-full bg-slate-900/95 backdrop-blur-md border-t border-slate-800 z-50">
    <div class="max-w-md mx-auto flex justify-around p-2 pb-safe">
      <button onclick="switchTab('matches')" id="nav-matches" class="nav-btn flex flex-col items-center p-2 text-blue-500 transition w-1/3">
        <span class="text-2xl mb-1">⚽</span>
        <span class="text-[10px] font-medium">Матчи</span>
      </button>
      <button onclick="switchTab('table')" id="nav-table" class="nav-btn flex flex-col items-center p-2 text-slate-500 transition w-1/3">
        <span class="text-2xl mb-1">🏆</span>
        <span class="text-[10px] font-medium">Рейтинг</span>
      </button>
      <button onclick="switchTab('profile')" id="nav-profile" class="nav-btn flex flex-col items-center p-2 text-slate-500 transition w-1/3">
        <span class="text-2xl mb-1">⚙️</span>
        <span class="text-[10px] font-medium">Настройки</span>
      </button>
    </div>
  </div>

  <style>
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0.5rem); }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

  <script>
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
    window.Telegram.WebApp.setHeaderColor('#0f172a');
    
    const tgUser = window.Telegram.WebApp.initDataUnsafe?.user;
    const tgUsername = (tgUser && tgUser.username) ? tgUser.username : 'Гость';
    const telegramId = (tgUser && tgUser.id) ? tgUser.id : Math.floor(Math.random() * 1000000);
    const ADMIN_ID = 438290253;
    
    const SUPABASE_URL = 'https://kvsrxuibrovumaikqptk.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt2c3J4dWlicm92dW1haWtxcHRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4Nzc0NTYsImV4cCI6MjEwMDQ1MzQ1Nn0.uKkIbZi7I0Q0jL0oMMq5k4ABQ_ge18yJo7tYSB_PYRI';
    const baseHeaders = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' };

    let allMatches = [];
    let allUsers = [];
    let currentRound = 'Группы'; 
    let editModeMatchId = null; 

    if (telegramId === ADMIN_ID) {
      document.getElementById('admin-panel').classList.remove('hidden');
    }

    // --- НАВИГАЦИЯ ---
    window.switchTab = function(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => { el.classList.remove('block'); el.classList.add('hidden'); });
      document.getElementById(`tab-${tabName}`).classList.remove('hidden');
      document.getElementById(`tab-${tabName}`).classList.add('block');
      document.querySelectorAll('.nav-btn').forEach(btn => { btn.classList.remove('text-blue-500'); btn.classList.add('text-slate-500'); });
      document.getElementById(`nav-${tabName}`).classList.remove('text-slate-500');
      document.getElementById(`nav-${tabName}`).classList.add('text-blue-500');

      const titleEl = document.getElementById('page-title');
      if (tabName === 'matches') titleEl.innerText = 'Сетка турнира';
      if (tabName === 'table') titleEl.innerText = 'Турнирный рейтинг';
      if (tabName === 'profile') titleEl.innerText = 'Настройки';
    }

    window.setRound = function(roundName) {
      currentRound = roundName;
      document.querySelectorAll('#round-buttons button').forEach(btn => {
        btn.className = 'px-5 py-2.5 rounded-full text-sm font-semibold bg-slate-800 text-slate-400 transition whitespace-nowrap';
      });
      
      let actId = '';
      if (roundName === 'Группы') actId = 'btn-groups';
      else if (roundName === '1/16 финала') actId = 'btn-1-16';
      else if (roundName === '1/8 финала') actId = 'btn-1-8';
      else if (roundName === '1/4 финала') actId = 'btn-1-4';
      else if (roundName === 'Полуфинал') actId = 'btn-semi';
      else if (roundName === 'Финал') actId = 'btn-final';
      
      if(actId) document.getElementById(actId).className = 'px-5 py-2.5 rounded-full text-sm font-semibold bg-blue-500 text-white transition whitespace-nowrap';
      
      editModeMatchId = null;
      renderMatches();
    }


    // --- НОВАЯ СМАРТ-ЛОГИКА: АВТО-ЖЕРЕБЬЕВКА ---
    window.autoDrawGroups = async function() {
      const players = allUsers.filter(u => u.username !== 'Аноним');
      const n = players.length;
      
      if (n < 4) {
        alert('Для старта турнира нужно минимум 4 участника!');
        return;
      }

      if (!confirm(`Найдено участников: ${n}. Система удалит старые группы и перемешает игроков заново. Продолжить?`)) return;

      // 1. Математика: определяем масштаб турнира
      let playoffSpots = 4; // по умолчанию полуфинал
      if (n >= 32) playoffSpots = 32;
      else if (n >= 16) playoffSpots = 16;
      else if (n >= 8) playoffSpots = 8;

      let groupCount = playoffSpots / 2; // Топ-2 выходят из каждой группы
      
      // 2. Перемешиваем игроков случайным образом (Fisher-Yates Shuffle)
      let shuffled = [...players].sort(() => 0.5 - Math.random());
      
      // 3. Создаем массивы для групп
      let newGroups = Array.from({length: groupCount}, () => []);
      
      // Раздаем игроков по группам по кругу (как колоду карт)
      shuffled.forEach((user, index) => {
        newGroups[index % groupCount].push(user);
      });

      // 4. Отправляем обновления в базу данных
      alert('Распределяем по группам... Это займет пару секунд.');
      
      for (let i = 0; i < groupCount; i++) {
        let groupLetter = String.fromCharCode(65 + i); // 65 это 'A'
        let groupName = 'Группа ' + groupLetter;
        
        for (let user of newGroups[i]) {
          await fetch(`${SUPABASE_URL}/rest/v1/users?id=eq.${user.id}`, {
            method: 'PATCH',
            headers: baseHeaders,
            body: JSON.stringify({ group_name: groupName })
          });
        }
      }
      
      alert(`Жеребьевка завершена! Создано групп: ${groupCount}. Загляни во вкладку "Рейтинг".`);
      await loadTournament();
      window.switchTab('table');
    }


    // --- НОВАЯ СМАРТ-ЛОГИКА: ЗАПУСК ПЛЕЙ-ОФФ ---
    window.startPlayoffs = async function() {
      if (!confirm('Создать сетку плей-офф? Убедись, что все матчи в группах сыграны. Топ-2 из каждой группы попадут в сетку!')) return;

      // Группируем игроков
      const groupedUsers = {};
      allUsers.forEach(u => {
        const gName = u.group_name;
        if (gName && gName !== 'Без группы') {
          if(!groupedUsers[gName]) groupedUsers[gName] = [];
          groupedUsers[gName].push(u);
        }
      });

      // Получаем отсортированные названия групп (Группа A, Группа B...)
      const validGroupNames = Object.keys(groupedUsers).sort();
      const gCount = validGroupNames.length;

      if (gCount === 0) {
        alert('Группы не найдены! Сначала проведи жеребьевку.');
        return;
      }

      // Определяем стадию плей-офф в зависимости от количества групп
      let roundName = 'Полуфинал'; // 2 группы
      if (gCount === 4) roundName = '1/4 финала';
      else if (gCount === 8) roundName = '1/8 финала';
      else if (gCount === 16) roundName = '1/16 финала';

      let matchesCreated = 0;

      // Логика УЕФА: Сводим группы попарно (А с В, С с D и т.д.)
      // 1-е место Группы 1 играет со 2-м местом Группы 2 и наоборот.
      for (let i = 0; i < gCount; i += 2) {
        let g1Name = validGroupNames[i];
        let g2Name = validGroupNames[i+1];
        
        if (!g1Name || !g2Name) continue; // Если нечетное число групп, пропускаем последнюю

        // Игроки уже отсортированы по очкам при загрузке турнира
        let u1_1 = groupedUsers[g1Name][0]; // 1 место первой группы
        let u1_2 = groupedUsers[g1Name][1]; // 2 место первой группы
        
        let u2_1 = groupedUsers[g2Name][0]; // 1 место второй группы
        let u2_2 = groupedUsers[g2Name][1]; // 2 место второй группы

        // Матч 1: (G1 Место 1) vs (G2 Место 2)
        if (u1_1 && u2_2) {
          await fetch(`${SUPABASE_URL}/rest/v1/matches`, {
            method: 'POST', headers: baseHeaders,
            body: JSON.stringify({ player1: u1_1.username, player2: u2_2.username, score1: 0, score2: 0, round: roundName, is_completed: false })
          });
          matchesCreated++;
        }
        
        // Матч 2: (G2 Место 1) vs (G1 Место 2)
        if (u2_1 && u1_2) {
          await fetch(`${SUPABASE_URL}/rest/v1/matches`, {
            method: 'POST', headers: baseHeaders,
            body: JSON.stringify({ player1: u2_1.username, player2: u1_2.username, score1: 0, score2: 0, round: roundName, is_completed: false })
          });
          matchesCreated++;
        }
      }

      alert(`Сетка плей-офф успешно сформирована! Раунд: ${roundName}. Создано матчей: ${matchesCreated}.`);
      setRound(roundName); // Переключаем вкладку на нужный раунд
      window.switchTab('matches');
      await loadTournament();
    }


    // --- ОСТАЛЬНЫЕ ФУНКЦИИ БЕЗ ИЗМЕНЕНИЙ ---
    async function sendNotification(username, text) {
      let user = allUsers.find(u => u.username === username);
      if (user && user.id) {
        try {
          await fetch(`${SUPABASE_URL}/rest/v1/notifications`, {
            method: 'POST', headers: baseHeaders, body: JSON.stringify({ telegram_id: user.id, message: text })
          });
        } catch(e) {}
      }
    }

    function renderMatches() {
      const container = document.getElementById('db-matches');
      const filteredMatches = allMatches.filter(m => m.round === currentRound);
      const isAdmin = (telegramId === ADMIN_ID);

      if (filteredMatches.length > 0) {
        container.innerHTML = filteredMatches.map(m => {
          if (editModeMatchId === m.id) {
            return `
            <div class="bg-slate-800 rounded-2xl p-5 border border-yellow-500/50 shadow-sm">
              <div class="text-center text-xs text-yellow-400 mb-2 font-bold">Редактирование</div>
              <div class="space-y-3">
                <div class="grid grid-cols-2 gap-2">
                  <input id="edit-p1-${m.id}" type="text" value="${m.player1}" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                  <input id="edit-p2-${m.id}" type="text" value="${m.player2}" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                </div>
                <select id="edit-round-${m.id}" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                  <option value="Группы" ${m.round === 'Группы' ? 'selected' : ''}>Групповой этап</option>
                  <option value="1/16 финала" ${m.round === '1/16 финала' ? 'selected' : ''}>1/16 финала</option>
                  <option value="1/8 финала" ${m.round === '1/8 финала' ? 'selected' : ''}>1/8 финала</option>
                  <option value="1/4 финала" ${m.round === '1/4 финала' ? 'selected' : ''}>1/4 финала</option>
                  <option value="Полуфинал" ${m.round === 'Полуфинал' ? 'selected' : ''}>Полуфинал</option>
                  <option value="Финал" ${m.round === 'Финал' ? 'selected' : ''}>Финал</option>
                </select>
                <div class="flex space-x-2">
                  <button onclick="saveMatchEdit(${m.id})" class="flex-1 bg-green-600 hover:bg-green-500 py-2 rounded-xl text-xs font-semibold text-white">💾 Сохранить</button>
                  <button onclick="cancelEdit()" class="flex-1 bg-slate-600 hover:bg-slate-500 py-2 rounded-xl text-xs font-semibold text-white">Отмена</button>
                </div>
              </div>
            </div>`;
          }

          return `
          <div class="bg-slate-800 rounded-2xl p-5 border border-slate-700/50 shadow-sm ${m.is_completed ? 'opacity-80' : ''}">
            <div class="flex justify-between items-center mb-2">
              <span class="text-xs text-slate-400">${m.round}</span>
              ${isAdmin ? `
                <div class="space-x-2">
                  ${!m.is_completed ? `<button onclick="editMatchMode(${m.id})" class="text-slate-400 hover:text-white text-xs transition">✏️</button>` : ''}
                  <button onclick="deleteMatch(${m.id})" class="text-red-400/70 hover:text-red-400 text-xs transition">✕</button>
                </div>
              ` : ''}
            </div>
            
            <div class="flex justify-between items-center font-bold text-slate-200">
              <span class="w-2/5 text-right truncate pr-2">${m.player1}</span> 
              <span class="w-1/5 text-center text-blue-400 text-lg">${m.score1} : ${m.score2}</span> 
              <span class="w-2/5 text-left truncate pl-2">${m.player2}</span>
            </div>
            
            ${isAdmin ? (m.is_completed ? `
              <div class="mt-4 pt-3 border-t border-slate-700/50 flex flex-col space-y-2">
                <div class="text-center text-xs text-green-400 font-semibold">✅ Завершен</div>
                <button onclick="rollbackMatch(${m.id}, '${m.player1}', '${m.player2}', ${m.score1}, ${m.score2})" class="bg-yellow-600/30 hover:bg-yellow-600/50 text-yellow-300 py-1.5 rounded-lg text-xs font-semibold transition">⏪ Отменить</button>
              </div>
            ` : `
              <div class="mt-4 pt-3 border-t border-slate-700/50 flex flex-col space-y-2">
                <div class="flex justify-center space-x-2">
                  <button onclick="changeScore(${m.id}, ${m.score1 + 1}, ${m.score2}, '${m.player1}', '${m.player2}')" class="bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-xs transition">+1 к ${m.player1}</button>
                  <button onclick="changeScore(${m.id}, ${m.score1}, ${m.score2 + 1}, '${m.player1}', '${m.player2}')" class="bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-xs transition">+1 к ${m.player2}</button>
                  <button onclick="resetScore(${m.id}, '${m.player1}', '${m.player2}')" class="bg-red-900/40 hover:bg-red-900/60 text-red-300 px-2 py-1 rounded text-xs transition">Сброс</button>
                </div>
                <button onclick="finishMatch(${m.id}, '${m.player1}', '${m.player2}', ${m.score1}, ${m.score2})" class="bg-green-600 hover:bg-green-500 py-2 rounded-lg text-xs font-semibold text-white transition">🏁 Завершить</button>
              </div>
            `) : (m.is_completed ? `<div class="mt-4 pt-3 border-t border-slate-700/50 text-center text-xs text-green-400 font-semibold">✅ Завершен</div>` : '')}
          </div>
        `}).join('');
      } else {
        container.innerHTML = `
        <div class="text-center text-slate-500 text-sm bg-slate-800/50 p-4 rounded-xl border border-slate-700/30 flex flex-col items-center">
          <span class="text-2xl mb-2">🤷‍♂️</span><span>Матчей в этом раунде пока нет.</span>
        </div>`;
      }
    }

    window.editMatchMode = function(matchId) { editModeMatchId = matchId; renderMatches(); }
    window.cancelEdit = function() { editModeMatchId = null; renderMatches(); }
    
    window.saveMatchEdit = async function(matchId) {
      const p1 = document.getElementById(`edit-p1-${matchId}`).value.trim();
      const p2 = document.getElementById(`edit-p2-${matchId}`).value.trim();
      const round = document.getElementById(`edit-round-${matchId}`).value;
      if (!p1 || !p2) return;
      await fetch(`${SUPABASE_URL}/rest/v1/matches?id=eq.${matchId}`, {
        method: 'PATCH', headers: baseHeaders, body: JSON.stringify({ player1: p1, player2: p2, round: round })
      });
      editModeMatchId = null; await loadTournament();
    }

    window.deleteMatch = async function(matchId) {
      if (!confirm('Удалить матч?')) return;
      await fetch(`${SUPABASE_URL}/rest/v1/matches?id=eq.${matchId}`, { method: 'DELETE', headers: baseHeaders });
      await loadTournament();
    }

    window.rollbackMatch = async function(matchId, p1Name, p2Name, s1, s2) {
      if (!confirm('Отменить завершение матча?')) return;
      let p1 = allUsers.find(u => u.username === p1Name);
      let p2 = allUsers.find(u => u.username === p2Name);

      if (p1) {
        let wins = p1.wins || 0; let losses = p1.losses || 0;
        if (s1 > s2 && wins > 0) wins--; if (s1 < s2 && losses > 0) losses--;
        await fetch(`${SUPABASE_URL}/rest/v1/users?id=eq.${p1.id}`, {
          method: 'PATCH', headers: baseHeaders,
          body: JSON.stringify({ wins: wins, losses: losses, goals_for: Math.max(0, (p1.goals_for || 0) - s1), goals_against: Math.max(0, (p1.goals_against || 0) - s2) })
        });
      }
      if (p2) {
        let wins = p2.wins || 0; let losses = p2.losses || 0;
        if (s2 > s1 && wins > 0) wins--; if (s2 < s1 && losses > 0) losses--;
        await fetch(`${SUPABASE_URL}/rest/v1/users?id=eq.${p2.id}`, {
          method: 'PATCH', headers: baseHeaders,
          body: JSON.stringify({ wins: wins, losses: losses, goals_for: Math.max(0, (p2.goals_for || 0) - s2), goals_against: Math.max(0, (p2.goals_against || 0) - s1) })
        });
      }
      await fetch(`${SUPABASE_URL}/rest/v1/matches?id=eq.${matchId}`, { method: 'PATCH', headers: baseHeaders, body: JSON.stringify({ is_completed: false }) });
      await loadTournament();
    }

    window.createMatch = async function() {
      const p1 = document.getElementById('new-p1').value.trim();
      const p2 = document.getElementById('new-p2').value.trim();
      const round = document.getElementById('new-round').value;
      if (!p1 || !p2) return;
      await fetch(`${SUPABASE_URL}/rest/v1/matches`, {
        method: 'POST', headers: baseHeaders,
        body: JSON.stringify({ player1: p1, player2: p2, score1: 0, score2: 0, round: round, is_completed: false })
      });
      await sendNotification(p1, `🔥 Назначен матч!\nСтадия: ${round}\n${p1} vs ${p2}`); 
      await sendNotification(p2, `🔥 Назначен матч!\nСтадия: ${round}\n${p1} vs ${p2}`);
      document.getElementById('new-p1').value = ''; document.getElementById('new-p2').value = '';
      window.switchTab('matches'); await loadTournament();
    }

    window.changeScore = async function(matchId, s1, s2, p1Name, p2Name) {
      await fetch(`${SUPABASE_URL}/rest/v1/matches?id=eq.${matchId}`, { method: 'PATCH', headers: baseHeaders, body: JSON.stringify({ score1: s1, score2: s2 }) });
      await loadTournament();
    }

    window.resetScore = async function(matchId, p1, p2) { window.changeScore(matchId, 0, 0, p1, p2); }

    window.finishMatch = async function(matchId, p1Name, p2Name, s1, s2) {
      if (!confirm('Завершить матч?')) return;
      let p1 = allUsers.find(u => u.username === p1Name);
      let p2 = allUsers.find(u => u.username === p2Name);

      if (p1) {
        let wins = p1.wins || 0; let losses = p1.losses || 0;
        if (s1 > s2) wins++; if (s1 < s2) losses++;
        await fetch(`${SUPABASE_URL}/rest/v1/users?id=eq.${p1.id}`, {
          method: 'PATCH', headers: baseHeaders,
          body: JSON.stringify({ wins: wins, losses: losses, goals_for: (p1.goals_for || 0) + s1, goals_against: (p1.goals_against || 0) + s2 })
        });
      }
      if (p2) {
        let wins = p2.wins || 0; let losses = p2.losses || 0;
        if (s2 > s1) wins++; if (s2 < s1) losses++;
        await fetch(`${SUPABASE_URL}/rest/v1/users?id=eq.${p2.id}`, {
          method: 'PATCH', headers: baseHeaders,
          body: JSON.stringify({ wins: wins, losses: losses, goals_for: (p2.goals_for || 0) + s2, goals_against: (p2.goals_against || 0) + s1 })
        });
      }
      await fetch(`${SUPABASE_URL}/rest/v1/matches?id=eq.${matchId}`, { method: 'PATCH', headers: baseHeaders, body: JSON.stringify({ is_completed: true }) });
      await sendNotification(p1Name, `🏁 Матч завершен! ${p1Name} [${s1} : ${s2}] ${p2Name}`); 
      await sendNotification(p2Name, `🏁 Матч завершен! ${p1Name} [${s1} : ${s2}] ${p2Name}`);
      await loadTournament();
    }

    window.deletePlayer = async function(userId) {
      if (!confirm('Удалить игрока?')) return;
      await fetch(`${SUPABASE_URL}/rest/v1/users?id=eq.${userId}`, { method: 'DELETE', headers: baseHeaders });
      await loadTournament();
    }

    window.changeGroup = async function(userId) {
      let newGroup = prompt('Группа:', 'Группа A');
      if (!newGroup) return;
      await fetch(`${SUPABASE_URL}/rest/v1/users?id=eq.${userId}`, {
        method: 'PATCH', headers: baseHeaders, body: JSON.stringify({ group_name: newGroup })
      });
      await loadTournament();
    }

    async function loadTournament() {
      let res = await fetch(`${SUPABASE_URL}/rest/v1/users?select=*`, { headers: baseHeaders });
      allUsers = await res.json();
      let me = allUsers.find(u => u.id === telegramId);
      
      if (!me) {
        await fetch(`${SUPABASE_URL}/rest/v1/users`, {
          method: 'POST', headers: { ...baseHeaders, 'Prefer': 'resolution=merge-duplicates' },
          body: JSON.stringify({ id: telegramId, username: tgUsername, wins: 0, losses: 0, goals_for: 0, goals_against: 0, group_name: 'Без группы' })
        });
        res = await fetch(`${SUPABASE_URL}/rest/v1/users?select=*`, { headers: baseHeaders });
        allUsers = await res.json();
      }
      
      if (me && !document.getElementById('nickname-input').value) document.getElementById('nickname-input').value = me.username;
      
      allUsers.sort((a, b) => {
        let ptsA = (a.wins || 0) * 3; let ptsB = (b.wins || 0) * 3;
        if (ptsA !== ptsB) return ptsB - ptsA;
        return ((b.goals_for || 0) - (b.goals_against || 0)) - ((a.goals_for || 0) - (a.goals_against || 0));
      });

      const groupedUsers = {};
      allUsers.forEach(u => {
        const gName = u.group_name || 'Без группы';
        if(!groupedUsers[gName]) groupedUsers[gName] = [];
        groupedUsers[gName].push(u);
      });

      let playersHtml = '';
      for (const [groupName, playersInGroup] of Object.entries(groupedUsers)) {
        playersHtml += `<h3 class="text-blue-400 font-bold mt-6 mb-3 px-2 border-b border-blue-900/50 pb-1">🏆 ${groupName}</h3>`;
        playersHtml += playersInGroup.map((user, i) => {
          const isMe = user.id === telegramId;
          const medal = i === 0 ? '1️⃣' : i === 1 ? '2️⃣' : i === 2 ? '3️⃣' : '⚽';
          return `
            <div class="p-4 rounded-xl border shadow-sm mb-3 ${isMe ? 'border-blue-500/50 bg-blue-900/20' : 'border-slate-700/50 bg-slate-800'}">
              <div class="flex items-center justify-between mb-2">
                <div class="flex items-center">
                  <div class="w-8 h-8 rounded-full bg-blue-500/20 flex items-center justify-center mr-3 text-blue-400 text-sm">${medal}</div>
                  <span class="font-semibold text-slate-200">${user.username || 'Аноним'}</span>
                </div>
                ${(telegramId === ADMIN_ID) ? `
                  <div class="flex space-x-2">
                    <button onclick="changeGroup(${user.id})" class="text-blue-400/70 hover:text-blue-400 px-2 py-1 bg-slate-900 rounded text-[10px] uppercase font-bold transition">⚙️</button>
                    <button onclick="deletePlayer(${user.id})" class="text-red-400/50 hover:text-red-400 px-2 py-1 rounded text-xs transition">✕</button>
                  </div>
                ` : ''}
              </div>
              <div class="grid grid-cols-3 gap-2 text-center text-xs bg-slate-900/50 p-2 rounded-lg text-slate-400">
                <div>Поб: <span class="text-white font-bold">${user.wins || 0} / ${user.losses || 0}</span></div>
                <div>Голы: <span class="text-white font-bold">${user.goals_for || 0} : ${user.goals_against || 0}</span></div>
                <div>Очки: <span class="text-blue-400 font-bold">${(user.wins || 0) * 3}</span></div>
              </div>
            </div>`;
        }).join('');
      }
      document.getElementById('db-players').innerHTML = playersHtml;

      let matchesRes = await fetch(`${SUPABASE_URL}/rest/v1/matches?select=*`, { headers: baseHeaders });
      allMatches = await matchesRes.json();
      allMatches.sort((a, b) => (a.is_completed === b.is_completed) ? 0 : a.is_completed ? 1 : -1);
      renderMatches();
    }

    window.saveNickname = async function() {
      const newName = document.getElementById('nickname-input').value.trim();
      if (!newName) return;
      await fetch(`${SUPABASE_URL}/rest/v1/users?id=eq.${telegramId}`, { method: 'PATCH', headers: baseHeaders, body: JSON.stringify({ username: newName }) });
      await loadTournament();
    }
    
    loadTournament();
  </script>
</body>
</html>
