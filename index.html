<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Турнирная сетка</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-slate-900 text-white p-4 font-sans antialiased min-h-screen">
  <div class="max-w-md mx-auto">
    
    <h1 class="text-2xl font-bold text-center mt-2 mb-6 text-slate-100">Сетка турнира</h1>
    
    <div class="bg-slate-800 rounded-2xl p-4 mb-6 border border-slate-700/50 shadow-sm">
      <p class="text-sm text-slate-400 mb-2">Твое имя в таблице:</p>
      <div class="flex space-x-2">
        <input id="nickname-input" type="text" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-blue-500" placeholder="Введи никнейм...">
        <button onclick="saveNickname()" id="save-btn" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-xl text-sm font-semibold text-white transition">Сохранить</button>
      </div>
      <p id="save-msg" class="text-xs text-green-400 mt-2 hidden">Ник успешно обновлен!</p>
    </div>
    
    <!-- Интерактивные кнопки стадий турнира -->
    <div class="flex overflow-x-auto space-x-2 pb-2 mb-6" id="round-buttons">
      <button onclick="setRound('1/8 финала')" id="btn-1-8" class="px-5 py-2.5 rounded-full text-sm font-semibold bg-blue-500 text-white transition">1/8 финала</button>
      <button onclick="setRound('1/4 финала')" id="btn-1-4" class="px-5 py-2.5 rounded-full text-sm font-semibold bg-slate-800 text-slate-400 transition">1/4 финала</button>
      <button onclick="setRound('Полуфинал')" id="btn-semi" class="px-5 py-2.5 rounded-full text-sm font-semibold bg-slate-800 text-slate-400 transition">Полуфинал</button>
      <button onclick="setRound('Финал')" id="btn-final" class="px-5 py-2.5 rounded-full text-sm font-semibold bg-slate-800 text-slate-400 transition">Финал</button>
    </div>

    <div id="db-matches" class="space-y-4 mb-8">
      <div class="text-center py-4 text-slate-500 text-sm animate-pulse">Загрузка матчей...</div>
    </div>

    <h2 class="text-lg font-bold mb-4 text-slate-200">🏆 Участники турнира:</h2>
    <div id="db-players" class="space-y-2 text-slate-300">
      <div class="text-center py-4 animate-pulse">Загрузка...</div>
    </div>

  </div>

  <script>
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();

    const tgUser = window.Telegram.WebApp.initDataUnsafe?.user;
    const tgUsername = (tgUser && tgUser.username) ? tgUser.username : 'Гость';
    const telegramId = (tgUser && tgUser.id) ? tgUser.id : Math.floor(Math.random() * 1000000);

    const SUPABASE_URL = 'https://kvsrxuibrovumaikqptk.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt2c3J4dWlicm92dW1haWtxcHRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4Nzc0NTYsImV4cCI6MjEwMDQ1MzQ1Nn0.uKkIbZi7I0Q0jL0oMMq5k4ABQ_ge18yJo7tYSB_PYRI';
    
    const baseHeaders = {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json'
    };

    // Глобальные переменные для фильтрации
    let allMatches = [];
    let currentRound = '1/8 финала';

    // Функция переключения вкладок
    window.setRound = function(roundName) {
      currentRound = roundName;
      
      // Обновляем стили всех кнопок (сбрасываем в серый)
      const buttons = document.querySelectorAll('#round-buttons button');
      buttons.forEach(btn => {
        btn.className = 'px-5 py-2.5 rounded-full text-sm font-semibold bg-slate-800 text-slate-400 transition';
      });

      // Находим нажатую кнопку и красим в синий
      let activeBtnId = '';
      if (roundName === '1/8 финала') activeBtnId = 'btn-1-8';
      else if (roundName === '1/4 финала') activeBtnId = 'btn-1-4';
      else if (roundName === 'Полуфинал') activeBtnId = 'btn-semi';
      else if (roundName === 'Финал') activeBtnId = 'btn-final';
      
      if (activeBtnId) {
        document.getElementById(activeBtnId).className = 'px-5 py-2.5 rounded-full text-sm font-semibold bg-blue-500 text-white transition';
      }

      // Перерисовываем матчи
      renderMatches();
    }

    // Функция отрисовки матчей в зависимости от выбранной вкладки
    function renderMatches() {
      const container = document.getElementById('db-matches');
      
      // Фильтруем матчи по выбранному раунду
      const filteredMatches = allMatches.filter(m => m.round === currentRound);

      if (filteredMatches.length > 0) {
        container.innerHTML = filteredMatches.map(m => `
          <div class="bg-slate-800 rounded-2xl p-5 border border-slate-700/50 shadow-sm">
            <div class="text-center text-xs text-slate-400 mb-2">${m.round}</div>
            <div class="flex justify-between items-center font-bold text-slate-200">
              <span class="w-2/5 text-right truncate pr-2">${m.player1 || 'Ожидание...'}</span> 
              <span class="w-1/5 text-center text-blue-400 text-lg">${m.score1} : ${m.score2}</span> 
              <span class="w-2/5 text-left truncate pl-2">${m.player2 || 'Ожидание...'}</span>
            </div>
          </div>
        `).join('');
      } else {
        container.innerHTML = `<div class="text-center text-slate-500 text-sm bg-slate-800/50 p-4 rounded-xl border border-slate-700/30">Матчи для стадии "${currentRound}" пока не назначены.</div>`;
      }
    }

    async function loadTournament() {
      const usersContainer = document.getElementById('db-players');
      
      try {
        // --- 1. ЗАГРУЗКА УЧАСТНИКОВ (без изменений) ---
        let response = await fetch(`${SUPABASE_URL}/rest/v1/users?select=*`, { method: 'GET', headers: baseHeaders });
        if (!response.ok) throw new Error('Ошибка чтения пользователей');
        let users = await response.json();
        
        let me = users.find(u => u.id === telegramId);
        
        if (!me) {
          await fetch(`${SUPABASE_URL}/rest/v1/users`, {
            method: 'POST',
            headers: { ...baseHeaders, 'Prefer': 'resolution=merge-duplicates' },
            body: JSON.stringify({ id: telegramId, username: tgUsername })
          });
          response = await fetch(`${SUPABASE_URL}/rest/v1/users?select=*`, { method: 'GET', headers: baseHeaders });
          users = await response.json();
          me = users.find(u => u.id === telegramId);
        }

        if (me && !document.getElementById('nickname-input').value) {
          document.getElementById('nickname-input').value = me.username;
        }

        if (users && users.length > 0) {
          usersContainer.innerHTML = users.map(user => {
            const isMe = user.id === telegramId;
            const displayName = user.username || 'Аноним';
            const highlightClass = isMe ? 'border-blue-500/50 bg-blue-900/20' : 'border-slate-700/50 bg-slate-800';
            
            return `
              <div class="p-4 rounded-xl border shadow-sm flex items-center ${highlightClass}">
                <div class="w-8 h-8 rounded-full bg-blue-500/20 flex items-center justify-center mr-3 text-blue-400">⚽</div>
                <span class="font-semibold text-slate-200">
                  ${displayName} 
                  ${isMe ? '<span class="text-xs text-blue-400 ml-1 font-normal">(Ты)</span>' : ''}
                </span>
              </div>
            `;
          }).join('');
        } else {
          usersContainer.innerHTML = '<div class="text-slate-500 text-center py-4">Список пока пуст.</div>';
        }

        // --- 2. ЗАГРУЗКА И ФИЛЬТРАЦИЯ МАТЧЕЙ ---
        try {
          const matchesRes = await fetch(`${SUPABASE_URL}/rest/v1/matches?select=*`, { method: 'GET', headers: baseHeaders });
          if (!matchesRes.ok) throw new Error('Таблица matches недоступна');
          allMatches = await matchesRes.json();
          
          // Вызываем отрисовку для текущей вкладки
          renderMatches();
          
        } catch (matchErr) {
          document.getElementById('db-matches').innerHTML = '<div class="text-center text-yellow-500/80 text-xs py-4">Ошибка загрузки матчей.</div>';
        }

      } catch (err) {
        usersContainer.innerHTML = `<div class="bg-red-900/50 p-3 rounded text-red-200 text-xs">Ошибка: ${err.message}</div>`;
      }
    }

    window.saveNickname = async function() {
      const newName = document.getElementById('nickname-input').value.trim();
      if (!newName) return;
      
      const btn = document.getElementById('save-btn');
      btn.innerText = '...';
      btn.disabled = true;
      
      try {
        const updateRes = await fetch(`${SUPABASE_URL}/rest/v1/users?id=eq.${telegramId}`, {
          method: 'PATCH',
          headers: baseHeaders,
          body: JSON.stringify({ username: newName })
        });
        
        if (!updateRes.ok) throw new Error('Не удалось обновить никнейм');
        
        const msg = document.getElementById('save-msg');
        msg.classList.remove('hidden');
        setTimeout(() => msg.classList.add('hidden'), 3000);
        
        await loadTournament();
      } catch (err) {
        alert(err.message);
      } finally {
        btn.innerText = 'Сохранить';
        btn.disabled = false;
      }
    }

    loadTournament();
  </script>
</body>
</html>
