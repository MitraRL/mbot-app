<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Турнирная сетка</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-slate-900 text-white p-4 font-sans antialiased min-h-screen">
  <div class="max-w-md mx-auto">
    
    <h1 class="text-2xl font-bold text-center mt-2 mb-6 text-slate-100">Сетка турнира</h1>
    
    <!-- Скрытая панель администратора -->
    <div id="admin-panel" class="hidden bg-slate-800/80 border border-blue-500/40 rounded-2xl p-4 mb-6 shadow-lg">
      <h2 class="text-sm font-bold text-blue-400 mb-3 flex items-center">
        👑 Панель организатора
      </h2>
      
      <div class="space-y-3">
        <div class="grid grid-cols-2 gap-2">
          <input id="new-p1" type="text" placeholder="Игрок 1" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
          <input id="new-p2" type="text" placeholder="Игрок 2" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
        </div>
        <select id="new-round" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
          <option value="1/8 финала">1/8 финала</option>
          <option value="1/4 финала">1/4 финала</option>
          <option value="Полуфинал">Полуфинал</option>
          <option value="Финал">Финал</option>
        </select>
        <button onclick="createMatch()" class="w-full bg-blue-600 hover:bg-blue-500 py-2 rounded-xl text-xs font-semibold text-white transition">
          + Создать матч
        </button>
      </div>
    </div>

    <!-- Настройки профиля -->
    <div class="bg-slate-800 rounded-2xl p-4 mb-6 border border-slate-700/50 shadow-sm">
      <p class="text-sm text-slate-400 mb-2">Твое имя в таблице:</p>
      <div class="flex space-x-2">
        <input id="nickname-input" type="text" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:border-blue-500" placeholder="Введи никнейм...">
        <button onclick="saveNickname()" id="save-btn" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-xl text-sm font-semibold text-white transition">Сохранить</button>
      </div>
      <p id="save-msg" class="text-xs text-green-400 mt-2 hidden">Ник успешно обновлен!</p>
    </div>
    
    <!-- Вкладки раундов -->
    <div class="flex overflow-x-auto space-x-2 pb-2 mb-6" id="round-buttons">
      <button onclick="setRound('1/8 финала')" id="btn-1-8" class="px-5 py-2.5 rounded-full text-sm font-semibold bg-blue-500 text-white transition">1/8 финала</button>
      <button onclick="setRound('1/4 финала')" id="btn-1-4" class="px-5 py-2.5 rounded-full text-sm font-semibold bg-slate-800 text-slate-400 transition">1/4 финала</button>
      <button onclick="setRound('Полуфинал')" id="btn-semi" class="px-5 py-2.5 rounded-full text-sm font-semibold bg-slate-800 text-slate-400 transition">Полуфинал</button>
      <button onclick="setRound('Финал')" id="btn-final" class="px-5 py-2.5 rounded-full text-sm font-semibold bg-slate-800 text-slate-400 transition">Финал</button>
    </div>

    <!-- Матчи -->
    <div id="db-matches" class="space-y-4 mb-8">
      <div class="text-center py-4 text-slate-500 text-sm animate-pulse">Загрузка матчей...</div>
    </div>

    <!-- Участники и статистика -->
    <h2 class="text-lg font-bold mb-4 text-slate-200">🏆 Участники и статистика:</h2>
    <div id="db-players" class="space-y-3 text-slate-300">
      <div class="text-center py-4 animate-pulse">Загрузка...</div>
    </div>

  </div>

  <script>
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();

    const tgUser = window.Telegram.WebApp.initDataUnsafe?.user;
    const tgUsername = (tgUser && tgUser.username) ? tgUser.username : 'Гость';
    const telegramId = (tgUser && tgUser.id) ? tgUser.id : Math.floor(Math.random() * 1000000);

    const ADMIN_ID = 438290253;

    const SUPABASE_URL = 'https://kvsrxuibrovumaikqptk.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt2c3J4dWlicm92dW1haWtxcHRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4Nzc0NTYsImV4cCI6MjEwMDQ1MzQ1Nn0.uKkIbZi7I0Q0jL0oMMq5k4ABQ_ge18yJo7tYSB_PYRI';
    
    const baseHeaders = {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json'
    };

    let allMatches = [];
    let currentRound = '1/8 финала';

    if (telegramId === ADMIN_ID) {
      document.getElementById('admin-panel').classList.remove('hidden');
    }

    window.setRound = function(roundName) {
      currentRound = roundName;
      const buttons = document.querySelectorAll('#round-buttons button');
      buttons.forEach(btn => {
        btn.className = 'px-5 py-2.5 rounded-full text-sm font-semibold bg-slate-800 text-slate-400 transition';
      });

      let activeBtnId = '';
      if (roundName === '1/8 финала') activeBtnId = 'btn-1-8';
      else if (roundName === '1/4 финала') activeBtnId = 'btn-1-4';
      else if (roundName === 'Полуфинал') activeBtnId = 'btn-semi';
      else if (roundName === 'Финал') activeBtnId = 'btn-final';
      
      if (activeBtnId) {
        document.getElementById(activeBtnId).className = 'px-5 py-2.5 rounded-full text-sm font-semibold bg-blue-500 text-white transition';
      }
      renderMatches();
    }

    function renderMatches() {
      const container = document.getElementById('db-matches');
      const filteredMatches = allMatches.filter(m => m.round === currentRound);
      const isAdmin = (telegramId === ADMIN_ID);

      if (filteredMatches.length > 0) {
        container.innerHTML = filteredMatches.map(m => `
          <div class="bg-slate-800 rounded-2xl p-5 border border-slate-700/50 shadow-sm ${m.is_completed ? 'opacity-80' : ''}">
            <div class="text-center text-xs text-slate-400 mb-2">${m.round}</div>
            <div class="flex justify-between items-center font-bold text-slate-200">
              <span class="w-2/5 text-right truncate pr-2">${m.player1 || 'Ожидание...'}</span> 
              <span class="w-1/5 text-center text-blue-400 text-lg">${m.score1} : ${m.score2}</span> 
              <span class="w-2/5 text-left truncate pl-2">${m.player2 || 'Ожидание...'}</span>
            </div>
            
            ${isAdmin ? (m.is_completed ? `
              <div class="mt-4 pt-3 border-t border-slate-700/50 text-center text-xs text-green-400 font-semibold">
                ✅ Матч завершен
              </div>
            ` : `
              <div class="mt-4 pt-3 border-t border-slate-700/50 flex flex-col space-y-2">
                <div class="flex justify-center space-x-2">
                  <button onclick="changeScore(${m.id}, ${m.score1 + 1}, ${m.score2})" class="bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-xs">+1 к ${m.player1}</button>
                  <button onclick="changeScore(${m.id}, ${m.score1}, ${m.score2 + 1})" class="bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-xs">+1 к ${m.player2}</button>
                  <button onclick="resetScore(${m.id})" class="bg-red-900/40 hover:bg-red-900/60 text-red-300 px-2 py-1 rounded text-xs">Сброс</button>
                </div>
                <button onclick="finishMatch(${m.id}, '${m.player1}', '${m.player2}', ${m.score1}, ${m.score2})" class="bg-green-600 hover:bg-green-500 py-2 rounded-lg text-xs font-semibold transition text-white">🏁 Завершить матч и начислить стату</button>
              </div>
            `) : (m.is_completed ? `
              <div class="mt-4 pt-3 border-t border-slate-700/50 text-center text-xs text-green-400 font-semibold">
                ✅ Матч завершен
              </div>
            ` : '')}
          </div>
        `).join('');
      } else {
        container.innerHTML = `<div class="text-center text-slate-500 text-sm bg-slate-800/50 p-4 rounded-xl border border-slate-700/30">Матчи для стадии "${currentRound}" пока не назначены.</div>`;
      }
    }

    window.createMatch = async function() {
      const p1 = document.getElementById('new-p1').value.trim();
      const p2 = document.getElementById('new-p2').value.trim();
      const round = document.getElementById('new-round').value;

      if (!p1 || !p2) {
        alert('Введи имена обоих игроков!');
        return;
      }

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/matches`, {
          method: 'POST',
          headers: baseHeaders,
          body: JSON.stringify({ player1: p1, player2: p2, score1: 0, score2: 0, round: round, is_completed: false })
        });

        if (!res.ok) throw new Error('Не удалось создать матч');

        document.getElementById('new-p1').value = '';
        document.getElementById('new-p2').value = '';
        await loadTournament();
      } catch (err) {
        alert(err.message);
      }
    }

    window.changeScore = async function(matchId, s1, s2) {
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/matches?id=eq.${matchId}`, {
          method: 'PATCH',
          headers: baseHeaders,
          body: JSON.stringify({ score1: s1, score2: s2 })
        });
        await loadTournament();
      } catch (err) {
        alert('Ошибка обновления счета');
      }
    }

    window.resetScore = async function(matchId) {
      window.changeScore(matchId, 0, 0);
    }

    // НОВАЯ ФУНКЦИЯ: ЗАВЕРШЕНИЕ МАТЧА И РАСЧЕТ СТАТИСТИКИ
    window.finishMatch = async function(matchId, p1Name, p2Name, s1, s2) {
      if (!confirm('Завершить матч и начислить статистику? Это действие нельзя отменить.')) return;

      try {
        // 1. Получаем текущую статистику обоих игроков из базы
        let res = await fetch(`${SUPABASE_URL}/rest/v1/users?username=in.("${p1Name}","${p2Name}")`, { headers: baseHeaders });
        let players = await res.json();

        let p1 = players.find(u => u.username === p1Name);
        let p2 = players.find(u => u.username === p2Name);

        // 2. Обновляем Игрока 1 (если он есть в базе)
        if (p1) {
          let wins = p1.wins || 0;
          let losses = p1.losses || 0;
          if (s1 > s2) wins++;
          if (s1 < s2) losses++;
          
          await fetch(`${SUPABASE_URL}/rest/v1/users?id=eq.${p1.id}`, {
            method: 'PATCH',
            headers: baseHeaders,
            body: JSON.stringify({
              wins: wins,
              losses: losses,
              goals_for: (p1.goals_for || 0) + s1,
              goals_against: (p1.goals_against || 0) + s2
            })
          });
        }

        // 3. Обновляем Игрока 2 (если он есть в базе)
        if (p2) {
          let wins = p2.wins || 0;
          let losses = p2.losses || 0;
          if (s2 > s1) wins++;
          if (s2 < s1) losses++;
          
          await fetch(`${SUPABASE_URL}/rest/v1/users?id=eq.${p2.id}`, {
            method: 'PATCH',
            headers: baseHeaders,
            body: JSON.stringify({
              wins: wins,
              losses: losses,
              goals_for: (p2.goals_for || 0) + s2,
              goals_against: (p2.goals_against || 0) + s1
            })
          });
        }

        // 4. Помечаем сам матч как завершенный
        await fetch(`${SUPABASE_URL}/rest/v1/matches?id=eq.${matchId}`, {
            method: 'PATCH',
            headers: baseHeaders,
            body: JSON.stringify({ is_completed: true })
        });

        await loadTournament();
      } catch (err) {
        alert('Ошибка при завершении матча: ' + err.message);
      }
    }

    window.deletePlayer = async function(userId) {
      if (!confirm('Точно хочешь удалить этого участника из турнира?')) return;
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/users?id=eq.${userId}`, { method: 'DELETE', headers: baseHeaders });
        await loadTournament();
      } catch (err) {
        alert('Ошибка при удалении: ' + err.message);
      }
    }

    async function loadTournament() {
      const usersContainer = document.getElementById('db-players');
      const isAdmin = (telegramId === ADMIN_ID);
      
      try {
        let response = await fetch(`${SUPABASE_URL}/rest/v1/users?select=*`, { method: 'GET', headers: baseHeaders });
        let users = await response.json();
        
        let me = users.find(u => u.id === telegramId);
        
        if (!me) {
          await fetch(`${SUPABASE_URL}/rest/v1/users`, {
            method: 'POST',
            headers: { ...baseHeaders, 'Prefer': 'resolution=merge-duplicates' },
            body: JSON.stringify({ id: telegramId, username: tgUsername, wins: 0, losses: 0, goals_for: 0, goals_against: 0 })
          });
          response = await fetch(`${SUPABASE_URL}/rest/v1/users?select=*`, { method: 'GET', headers: baseHeaders });
          users = await response.json();
          me = users.find(u => u.id === telegramId);
        }

        if (me && !document.getElementById('nickname-input').value) {
          document.getElementById('nickname-input').value = me.username;
        }

        // Сортируем игроков по очкам (победы * 3) и разнице мячей для красивой таблицы
        users.sort((a, b) => {
          let ptsA = (a.wins || 0) * 3;
          let ptsB = (b.wins || 0) * 3;
          if (ptsA !== ptsB) return ptsB - ptsA;
          let gdA = (a.goals_for || 0) - (a.goals_against || 0);
          let gdB = (b.goals_for || 0) - (b.goals_against || 0);
          return gdB - gdA;
        });

        if (users && users.length > 0) {
          usersContainer.innerHTML = users.map((user, index) => {
            const isMe = user.id === telegramId;
            const displayName = user.username || 'Аноним';
            const highlightClass = isMe ? 'border-blue-500/50 bg-blue-900/20' : 'border-slate-700/50 bg-slate-800';
            const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : '⚽';
            
            return `
              <div class="p-4 rounded-xl border shadow-sm ${highlightClass}">
                <div class="flex items-center justify-between mb-2">
                  <div class="flex items-center">
                    <div class="w-8 h-8 rounded-full bg-blue-500/20 flex items-center justify-center mr-3 text-blue-400">${medal}</div>
                    <span class="font-semibold text-slate-200">
                      ${displayName} 
                      ${isMe ? '<span class="text-xs text-blue-400 ml-1 font-normal">(Ты)</span>' : ''}
                    </span>
                  </div>
                  ${isAdmin ? `<button onclick="deletePlayer(${user.id})" class="text-red-400/50 hover:text-red-400 hover:bg-red-900/30 px-2 py-1 rounded text-xs transition">✕ Удалить</button>` : ''}
                </div>
                <div class="grid grid-cols-3 gap-2 text-center text-xs bg-slate-900/50 p-2 rounded-lg text-slate-400">
                  <div>Поб/Пор: <span class="text-white font-bold">${user.wins || 0} / ${user.losses || 0}</span></div>
                  <div>Голы: <span class="text-white font-bold">${user.goals_for || 0} : ${user.goals_against || 0}</span></div>
                  <div>Очки: <span class="text-blue-400 font-bold">${(user.wins || 0) * 3}</span></div>
                </div>
              </div>
            `;
          }).join('');
        } else {
          usersContainer.innerHTML = '<div class="text-slate-500 text-center py-4">Список пока пуст.</div>';
        }

        const matchesRes = await fetch(`${SUPABASE_URL}/rest/v1/matches?select=*`, { method: 'GET', headers: baseHeaders });
        allMatches = await matchesRes.json();
        renderMatches();

      } catch (err) {
        usersContainer.innerHTML = `<div class="bg-red-900/50 p-3 rounded text-red-200 text-xs">Ошибка: ${err.message}</div>`;
      }
    }

    window.saveNickname = async function() {
      // ...содержимое осталось без изменений...
      const newName = document.getElementById('nickname-input').value.trim();
      if (!newName) return;
      const btn = document.getElementById('save-btn');
      btn.innerText = '...';
      btn.disabled = true;
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/users?id=eq.${telegramId}`, {
          method: 'PATCH',
          headers: baseHeaders,
          body: JSON.stringify({ username: newName })
        });
        const msg = document.getElementById('save-msg');
        msg.classList.remove('hidden');
        setTimeout(() => msg.classList.add('hidden'), 3000);
        await loadTournament();
      } catch (err) {
        alert(err.message);
      } finally {
        btn.innerText = 'Сохранить';
        btn.disabled = false;
      }
    }

    loadTournament();
  </script>
</body>
</html>
